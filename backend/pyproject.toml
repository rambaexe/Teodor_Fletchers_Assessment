[project]
name = "fletchers-ingest"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-docx>=1.2.0",
    "pypdf[image]>=6.19.0",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
